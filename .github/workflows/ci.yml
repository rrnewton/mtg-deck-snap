name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy -- -D warnings

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package
        run: |
          cd target/release
          tar czf mtg-deck-snap-x86_64-unknown-linux-gnu.tar.gz mtg-deck-snap
          shasum -a 256 mtg-deck-snap-x86_64-unknown-linux-gnu.tar.gz > mtg-deck-snap-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/mtg-deck-snap-x86_64-unknown-linux-gnu.tar.gz
            target/release/mtg-deck-snap-x86_64-unknown-linux-gnu.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
